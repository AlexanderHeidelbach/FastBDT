name: CI (macOS)

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    name: Build and test on macOS
    runs-on: macos-latest
    env:
      CC: clang
      CXX: clang++
      CMAKE_USE_DOUBLE_WEIGHT: "OFF"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake

      - name: Build and install GoogleTest
        run: |
          git clone --branch release-1.12.0 --depth 1 https://github.com/google/googletest.git /tmp/googletest
          cmake -S /tmp/googletest -B /tmp/googletest/build \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          make -C /tmp/googletest/build -j$(sysctl -n hw.ncpu) install

      - name: Set up Python venv
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install setuptools wheel

      - name: Configure CMake
        # Venv must be active so cmake caches the venv python3 for the pip install at install time
        run: |
          source venv/bin/activate
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DUSE_DOUBLE_WEIGHT=${{ env.CMAKE_USE_DOUBLE_WEIGHT }}

      - name: Build
        run: make -C build -j$(sysctl -n hw.ncpu)

      - name: Install and verify Python module
        run: |
          source venv/bin/activate
          make -C build install
          python3 -c "import PyFastBDT; print('PyFastBDT version:', PyFastBDT.__version__)"

      - name: Run unit tests
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/install/lib:/usr/local/lib
        run: ${{ github.workspace }}/install/bin/fastbdt-unittests

      - name: Run C++ example
        run: |
          cd examples
          $CXX IRISExample.cxx -o IRISExample -O3 \
            -lFastBDT_static \
            -L ${{ github.workspace }}/install/lib \
            -I ${{ github.workspace }}/install/include
          ./IRISExample iris.csv

      - name: Run Python examples
        run: |
          source venv/bin/activate
          cd examples
          python3 iris_example.py iris.csv
          python3 generic_example.py
